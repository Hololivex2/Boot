name: Build PixelBoost ADB APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract PixelBoost project archive
        run: |
          if [ -f pixelboost-adb.zip ]; then
            mkdir -p /tmp/pixelboost-project
            unzip -q pixelboost-adb.zip -d /tmp/pixelboost-project
            cp -a /tmp/pixelboost-project/. .
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36.1
            build-tools;36.0.0

      - name: Verify Android Gradle project
        run: |
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "::error::Missing settings.gradle(.kts). Upload pixelboost-adb.zip to the repository root."
            exit 1
          fi
          if [ ! -f app/build.gradle.kts ] && [ ! -f app/build.gradle ]; then
            echo "::error::Missing app Gradle module."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelBoost-ADB-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
